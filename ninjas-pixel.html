<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f1020;font-family:Arial,sans-serif;color:#fff;touch-action:manipulation}
  #bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#232650 0%,#0f1020 70%)}
  #stage{position:fixed;top:0;left:0;right:0;bottom:215px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  #name{font-size:34px;font-weight:900;letter-spacing:5px;text-shadow:0 0 18px var(--glow),0 3px 6px #000;margin-top:10px}
  #elem{font-size:15px;color:#bbb;margin-top:2px}
  #anim{display:flex;gap:8px;margin-top:14px}
  .b{padding:10px 16px;border-radius:12px;border:2px solid #555;background:#1a1c30;font-weight:bold;font-size:14px;user-select:none}
  .b.on{border-color:var(--glow);background:#2a2040}
  #row2{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
  #row{position:fixed;bottom:112px;left:0;right:0;display:flex;justify-content:center;gap:6px}
  .thumb{border:2px solid transparent;border-radius:10px;padding:2px;background:#161830}
  .thumb.on{border-color:var(--glow)}
  #arrows{position:fixed;top:45%;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none}
  #arrows div{pointer-events:auto;font-size:38px;padding:10px 16px;color:#aaa;user-select:none}
</style>
</head>

/* ---------- ציור ---------- */
const OX=2, OY=4;
const NINJA_LAYOUT={cw:28,ch:36,head:[8,2],torso:[7,10],armL:[4,11],armR:[17,11],legL:[8,19],legR:[12,19],cape:[5,10],capeGrid:CAPE,shadow:[6,27,12],legCut:1,strikeArm:{g:['AAAAAAA','GGG....'],pos:[17,13]},partW:{arm:3,leg:4}};
const BIG_LAYOUT={cw:42,ch:44,head:[10,0],torso:[9,10],armL:[5,11],armR:[23,11],legL:[10,21],legR:[17,21],cape:[7,10],capeGrid:BIG_CAPE,shadow:[7,30,20],legCut:1,strikeArm:{g:['AAAAAAAAA','GGGG.....'],pos:[23,13]}};
function layoutOf(ch){ return ch.big?BIG_LAYOUT:NINJA_LAYOUT; }
function blit(ctx,s,grid,x,y,cols,cut=0){ for(let j=0;j<grid.length-cut;j++){ const row=grid[j]; for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.')continue; const col=cols[ch]; if(!col)continue; ctx.fillStyle=col; ctx.fillRect((OX+x+i)*s,(OY+y+j)*s,s,s);} } }
function drawChar(ctx,s,ch,anim,t,face=1){
  const c=ch.c, f=Math.floor(t*8), L=layoutOf(ch), ARMG=ch.arm||ARM, LEGG=ch.leg||LEG, CAPEG=ch.cape||L.capeGrid;
  ctx.clearRect(0,0,L.cw*s,L.ch*s);
  ctx.save(); if(face<0){ ctx.translate(L.cw*s,0); ctx.scale(-1,1); }
  let bob=0, legL=0, legR=0, armL=0, armR=0, lean=0, strike=false, wind=false;
  if(anim==='idle'){ bob=(f%2); }
  if(anim==='walk'){ const k=f%4; legL=[-1,0,1,0][k]; legR=[1,0,-1,0][k]; armL=[1,0,-1,0][k]; armR=[-1,0,1,0][k]; bob=(k%2?1:0); }
  if(anim==='attack'){ const k=f%6; if(k<2){ wind=true; armR=-2; lean=-1; } else if(k<4){ strike=true; lean=2; armR=-3; } else { armR=-1; } }
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect((OX+L.shadow[0])*s,(OY+L.shadow[1])*s,L.shadow[2]*s,2*s);
  const cx=L.shadow[0]+L.shadow[2]/2, cy=L.shadow[1]-2;
  const parts=(front)=>{ for(let i=0;i<6;i++){ const a=t*2+i*1.05, r=L.shadow[2]*.7+Math.sin(t*3+i)*2; const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*2.2-i*.3; if((Math.sin(a)>=0)===front){ ctx.fillStyle=ch.p[i%3]; ctx.fillRect(Math.round((OX+px))*s,Math.round((OY+py))*s,s,s);} } };
  if(ch.p.length) parts(false);
  if(!ch.noCape){ for(let j=0;j<CAPEG.length;j++){ const sway=j>6?Math.round(Math.sin(t*3+j*.35)*1.2)+(strike?-2:0):0; blit(ctx,s,[CAPEG[j]],L.cape[0]+lean*.5+sway,L.cape[1]+j+bob,c); } }
  (ch.extras||[]).filter(e=>!e.front).forEach(e=>blit(ctx,s,e.g,e.pos[0]+lean,e.pos[1]+bob,c));
  blit(ctx,s,LEGG,L.legL[0]+lean,L.legL[1]+Math.max(0,legL),c,legL<0?1:0); blit(ctx,s,LEGG,L.legR[0]+lean,L.legR[1]+Math.max(0,legR),c,legR<0?1:0);
  blit(ctx,s,ch.torso,L.torso[0]+lean,L.torso[1]+bob,c);
  blit(ctx,s,ARMG,L.armL[0]+lean,L.armL[1]+bob+armL,c);
  (ch.extras||[]).filter(e=>e.front).forEach(e=>blit(ctx,s,e.g,e.pos[0]+lean,e.pos[1]+bob+armL,c));
  if(strike){ const sa=L.strikeArm; const cols={A:c.A,G:ch.arm?c[ch.arm[ch.arm.length-1][0]]:c.G}; blit(ctx,s,sa.g,sa.pos[0]+lean,sa.pos[1]+bob,cols); }
  else blit(ctx,s,ARMG,L.armR[0]+lean,L.armR[1]+bob+armR,c);
  blit(ctx,s,ch.head,L.head[0]+lean,L.head[1]+bob,c);
  if(ch.hood) blit(ctx,s,ch.hood,L.head[0]-1+lean,L.head[1]-2+bob,c);
  const hair=ch.hair[f%ch.hair.length]; if(hair.length) blit(ctx,s,hair,L.head[0]-1+lean,L.head[1]-4+bob,c);
  if(f%8<6){ const eo=ch.eyeOff||[[1,4],[5,4]], ew=ch.eyeW||2; ctx.fillStyle=c.E; ctx.globalAlpha=.35; eo.forEach(([x,y])=>ctx.fillRect((OX+L.head[0]+x-1+lean)*s,(OY+L.head[1]+y+bob)*s,(ew+2)*s,s)); ctx.globalAlpha=1; }
  const w=ch.weapon;
  if(strike){ const off=w.thrown?Math.min(10,(f%6-2)*5):0; blit(ctx,s,w.strike,w.strikePos[0]+lean+off,w.strikePos[1]+bob,c); }
  else if(wind){ blit(ctx,s,w.rest,w.restPos[0]+lean,w.restPos[1]+bob-4,c); }
  else blit(ctx,s,w.rest,w.restPos[0]+lean,w.restPos[1]+bob+armR,c);
  if(ch.p.length) parts(true);
  if(strike){ for(let i=0;i<8;i++){ ctx.fillStyle=(ch.p.length?ch.p:[ch.glow])[i%Math.max(1,ch.p.length)]; const px=L.armR[0]+5+lean+i*1.2+Math.random()*2, py=12+Math.random()*10; ctx.fillRect(Math.round(OX+px)*s,Math.round(OY+py)*s,s,s);} }
  ctx.restore();
}

const ALL=[...CHARS,...ENEMIES];

const big=document.getElementById('big'); const S=Math.floor(Math.min(innerWidth*.85/42,(innerHeight-360)/44)); const bctx=big.getContext('2d');
const row=document.getElementById('row'), row2=document.getElementById('row2');
const thumbs=ALL.map((ch,i)=>{ const L=layoutOf(ch); const d=document.createElement('div'); d.className='thumb'; const c=document.createElement('canvas'); c.width=L.cw*2; c.height=L.ch*2; d.appendChild(c); d.onclick=()=>select(i); (ch.enemy?row2:row).appendChild(d); return c; });
function select(i){ cur=i; const ch=ALL[i], L=layoutOf(ch); big.width=L.cw*S; big.height=L.ch*S; document.body.style.setProperty('--glow',ch.glow); document.getElementById('name').textContent=ch.name; document.getElementById('elem').textContent=ch.enemy?ch.elem:'נינג\'ת ה'+ch.elem; document.querySelectorAll('.thumb').forEach((t,j)=>t.classList.toggle('on',j===i)); }
document.querySelectorAll('.b').forEach(b=>b.onclick=()=>{ anim=b.dataset.a; document.querySelectorAll('.b').forEach(x=>x.classList.toggle('on',x===b)); });
document.getElementById('prev').onclick=()=>select((cur+ALL.length-1)%ALL.length); document.getElementById('next').onclick=()=>select((cur+1)%ALL.length);
select(cur);
let t0=performance.now();
function loop(now){ const t=(now-t0)/1000; drawChar(bctx,S,ALL[cur],anim,t); thumbs.forEach((c,i)=>drawChar(c.getContext('2d'),2,ALL[i],'idle',t+i*.4)); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
