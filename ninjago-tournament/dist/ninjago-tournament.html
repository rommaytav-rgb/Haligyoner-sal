<script>
/* ============================================================
   NT.Util — math, easing, random, color helpers
   ============================================================ */
window.NT = window.NT || {};

NT.Util = (function () {
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const inv = (a, b, v) => (b === a ? 0 : clamp((v - a) / (b - a), 0, 1));
  const remap = (a, b, c, d, v) => lerp(c, d, inv(a, b, v));
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  const angleLerp = (a, b, t) => {
    let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    return a + d * t;
  };
  const angleDiff = (a, b) => (((b - a + Math.PI) % TAU) + TAU) % TAU - Math.PI;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const chance = (p) => Math.random() < p;
  const sign = (v) => (v < 0 ? -1 : 1);
  const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  const damp = (v, target, rate, dt) => lerp(v, target, 1 - Math.exp(-rate * dt));

  const ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => t * (2 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    inBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
    outElastic: (t) => { if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1; },
    outBounce: (t) => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    },
    pulse: (t) => Math.sin(t * Math.PI),
  };

  // Simple seeded PRNG (mulberry32) for deterministic textures
  function seeded(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- colors ----
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  }
  function shade(hex, amt) { // amt -1..1 (darken..lighten)
    const [r, g, b] = hexToRgb(hex);
    if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  }
  function mix(h1, h2, t) {
    const a = hexToRgb(h1), b = hexToRgb(h2);
    return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
  }
  function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

  function fmtNum(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }

  return { TAU, clamp, lerp, inv, remap, dist, angleLerp, angleDiff, rand, randInt, pick, chance, sign, approach, damp, ease, seeded, hexToRgb, rgbToHex, shade, mix, rgba, fmtNum, makeCanvas };
})();

</script>
<script>
/* ============================================================
   NT.Save — localStorage persistence
   ============================================================ */
NT.Save = (function () {
  const KEY = 'ninjago_tournament_save_v1';
  let data = null;

  function defaults() {
    return {
      version: 1,
      studs: 0,
      unlocked: { lloyd: true, kai: true, jay: true, cole: true, zane: true },
      levels: {},          // charId -> { level, xp }
      progress: {},        // arenaId -> { cleared: n }
      currentArena: 'chens_arena',
      currentRound: 0,
      selectedChar: 'lloyd',
      settings: { music: true, sfx: true, shake: true, leftHanded: false, buttonSize: 1, showHints: true },
      lastGift: 0,
      giftStreak: 0,
      stats: { wins: 0, losses: 0, kills: 0, maxCombo: 0, studsEarned: 0, battles: 0 },
      seenIntro: false,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        data = Object.assign(defaults(), parsed);
        data.settings = Object.assign(defaults().settings, parsed.settings || {});
        data.stats = Object.assign(defaults().stats, parsed.stats || {});
        data.unlocked = Object.assign(defaults().unlocked, parsed.unlocked || {});
      } else data = defaults();
    } catch (e) { data = defaults(); }
    return data;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ }
  }
  function reset() { data = defaults(); save(); return data; }
  function get() { return data || load(); }

  function charLevel(id) {
    const d = get();
    if (!d.levels[id]) d.levels[id] = { level: 1, xp: 0 };
    return d.levels[id];
  }
  function arenaProgress(id) {
    const d = get();
    if (!d.progress[id]) d.progress[id] = { cleared: 0 };
    return d.progress[id];
  }

  return { load, save, reset, get, charLevel, arenaProgress, defaults };
})();

</script>
<script>
/* ============================================================
   NT.Audio — WebAudio SFX + procedural music.
   Every sound is synthesized so the game ships with no
   copyrighted audio. Drop files into assets/audio/<name>.mp3
   (see MANIFEST) and they will be used instead of synthesis.
   ============================================================ */
NT.Audio = (function () {
  let ctx = null, master = null, sfxGain = null, musicGain = null, unlocked = false;
  const buffers = {};   // name -> AudioBuffer (from files, optional)
  const MANIFEST = ['click', 'back', 'whoosh', 'swing', 'swing2', 'swing3', 'hit', 'hit2', 'heavy', 'kick', 'slam', 'block', 'parry', 'dodge',
    'spin_start', 'stud', 'stud_gold', 'stud_blue', 'hurt', 'break', 'victory', 'defeat', 'gong', 'unlock', 'levelup', 'fire', 'ice', 'lightning',
    'earth', 'energy', 'step', 'throw', 'boss_intro', 'combo', 'select', 'gift', 'buy', 'error', 'jump', 'land', 'burst'];

  function ensure() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      sfxGain = ctx.createGain(); sfxGain.connect(master);
      musicGain = ctx.createGain(); musicGain.connect(master);
      applySettings();
      loadFiles();
      return true;
    } catch (e) { return false; }
  }
  function unlock() {
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!unlocked) { unlocked = true; startMusicIfPending(); }
  }
  function applySettings() {
    if (!ctx) return;
    const s = NT.Save.get().settings;
    sfxGain.gain.value = s.sfx ? 1 : 0;
    musicGain.gain.value = s.music ? 0.55 : 0;
  }
  function loadFiles() {
    // optional real audio files (replaceable assets) — only probed over http(s)
    if (!/^https?:/.test(location.protocol)) return;
    const base = 'assets/audio/';
    for (const n of MANIFEST) {
      fetch(base + n + '.mp3').then((r) => (r.ok ? r.arrayBuffer() : null)).then((ab) => {
        if (!ab) return;
        return ctx.decodeAudioData(ab).then((buf) => { buffers[n] = buf; });
      }).catch(() => {});
    }
  }

  // ---------- synthesis helpers ----------
  let noiseBuf = null;
  function noise() {
    if (noiseBuf) return noiseBuf;
    const len = ctx.sampleRate * 1.5;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function env(g, t0, a, d, peak = 1, sustain = 0, r = 0.05, hold = 0) {
    g.gain.cancelScheduledValues(t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sustain || 0.0001), t0 + a + d);
    if (hold > 0) g.gain.setValueAtTime(Math.max(0.0001, sustain), t0 + a + d + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d + hold + r);
  }
  function osc(type, f0, t0, dur, gain = 0.3, f1 = null, dest = null) {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 != null) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.1);
    return { o, g };
  }
  function noiseBurst(t0, dur, gain, filterType = 'bandpass', f0 = 1000, f1 = null, q = 1, dest = null) {
    const s = ctx.createBufferSource(); s.buffer = noise();
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.setValueAtTime(f0, t0); f.Q.value = q;
    if (f1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    const g = ctx.createGain();
    s.connect(f); f.connect(g); g.connect(dest || sfxGain);
    s.start(t0); s.stop(t0 + dur + 0.1);
    return { s, g, f };
  }

  const SYNTH = {
    click(t) { const { g } = osc('square', 900, t, 0.06, 0.2, 600); env(g, t, 0.003, 0.05, 0.25); const n = noiseBurst(t, 0.04, 0.1, 'highpass', 3000); env(n.g, t, 0.002, 0.03, 0.15); },
    select(t) { const a = osc('triangle', 660, t, 0.12, 0.3, 880); env(a.g, t, 0.005, 0.1, 0.3); const b = osc('triangle', 990, t + 0.06, 0.15, 0.25); env(b.g, t + 0.06, 0.005, 0.12, 0.25); },
    back(t) { const a = osc('triangle', 700, t, 0.12, 0.3, 420); env(a.g, t, 0.005, 0.1, 0.3); },
    whoosh(t) { const n = noiseBurst(t, 0.35, 0.3, 'bandpass', 400, 2400, 0.8); env(n.g, t, 0.05, 0.25, 0.35); },
    swing(t) { const n = noiseBurst(t, 0.16, 0.3, 'bandpass', 1800, 500, 1.2); env(n.g, t, 0.01, 0.13, 0.35); },
    swing2(t) { const n = noiseBurst(t, 0.16, 0.3, 'bandpass', 2200, 600, 1.2); env(n.g, t, 0.01, 0.13, 0.35); },
    swing3(t) { const n = noiseBurst(t, 0.24, 0.35, 'bandpass', 2600, 400, 1.0); env(n.g, t, 0.01, 0.2, 0.45); const o = osc('sawtooth', 300, t, 0.2, 0.08, 120); env(o.g, t, 0.01, 0.18, 0.1); },
    hit(t) { const o = osc('square', 220, t, 0.09, 0.3, 90); env(o.g, t, 0.002, 0.08, 0.35); const n = noiseBurst(t, 0.08, 0.3, 'lowpass', 2500, 400); env(n.g, t, 0.002, 0.07, 0.4); },
    hit2(t) { const o = osc('square', 260, t, 0.09, 0.3, 100); env(o.g, t, 0.002, 0.08, 0.35); const n = noiseBurst(t, 0.09, 0.3, 'bandpass', 1500, 300, 0.7); env(n.g, t, 0.002, 0.08, 0.4); },
    heavy(t) { const o = osc('sine', 140, t, 0.3, 0.6, 40); env(o.g, t, 0.003, 0.25, 0.7); const n = noiseBurst(t, 0.2, 0.4, 'lowpass', 1800, 200); env(n.g, t, 0.003, 0.18, 0.5); },
    kick(t) { const o = osc('sine', 200, t, 0.15, 0.5, 60); env(o.g, t, 0.003, 0.13, 0.55); const n = noiseBurst(t, 0.1, 0.3, 'bandpass', 900, 300); env(n.g, t, 0.002, 0.09, 0.35); },
    slam(t) { const o = osc('sine', 90, t, 0.5, 0.8, 30); env(o.g, t, 0.005, 0.45, 0.9); const n = noiseBurst(t, 0.4, 0.5, 'lowpass', 1200, 100); env(n.g, t, 0.005, 0.35, 0.6); },
    block(t) { const o = osc('triangle', 1400, t, 0.12, 0.25, 900); env(o.g, t, 0.002, 0.1, 0.3); const n = noiseBurst(t, 0.1, 0.25, 'highpass', 2500); env(n.g, t, 0.002, 0.08, 0.3); },
    parry(t) { const o = osc('triangle', 2000, t, 0.25, 0.3, 1500); env(o.g, t, 0.002, 0.2, 0.35); const o2 = osc('sine', 3000, t, 0.3, 0.15, 2400); env(o2.g, t, 0.002, 0.28, 0.2); },
    dodge(t) { const n = noiseBurst(t, 0.22, 0.25, 'bandpass', 600, 1800, 1); env(n.g, t, 0.02, 0.18, 0.3); },
    jump(t) { const o = osc('sine', 300, t, 0.18, 0.2, 700); env(o.g, t, 0.01, 0.15, 0.25); },
    land(t) { const o = osc('sine', 120, t, 0.15, 0.4, 50); env(o.g, t, 0.003, 0.12, 0.45); },
    spin_start(t) { const n = noiseBurst(t, 0.9, 0.35, 'bandpass', 300, 3000, 1.5); env(n.g, t, 0.15, 0.7, 0.4); const o = osc('sawtooth', 120, t, 0.9, 0.12, 700); env(o.g, t, 0.1, 0.75, 0.15); },
    stud(t) { const o = osc('sine', 1900, t, 0.09, 0.22, 2600); env(o.g, t, 0.002, 0.08, 0.25); },
    stud_gold(t) { const o = osc('sine', 2200, t, 0.12, 0.25, 3200); env(o.g, t, 0.002, 0.1, 0.28); const o2 = osc('sine', 3300, t + 0.04, 0.1, 0.15); env(o2.g, t + 0.04, 0.002, 0.08, 0.18); },
    stud_blue(t) { [1500, 2000, 2500, 3000].forEach((f, i) => { const o = osc('sine', f, t + i * 0.04, 0.12, 0.2); env(o.g, t + i * 0.04, 0.002, 0.1, 0.22); }); },
    hurt(t) { const o = osc('sawtooth', 400, t, 0.18, 0.2, 150); env(o.g, t, 0.003, 0.15, 0.25); const n = noiseBurst(t, 0.12, 0.3, 'lowpass', 1500, 300); env(n.g, t, 0.003, 0.1, 0.35); },
    break(t) { for (let i = 0; i < 5; i++) { const tt = t + i * 0.03; const o = osc('square', 900 + Math.random() * 1200, tt, 0.05, 0.12, 300); env(o.g, tt, 0.002, 0.045, 0.14); } const n = noiseBurst(t, 0.25, 0.35, 'highpass', 1800); env(n.g, t, 0.003, 0.2, 0.4); },
    victory(t) { const seq = [523, 659, 784, 1047, 784, 1047, 1319]; seq.forEach((f, i) => { const tt = t + i * 0.13; const o = osc('triangle', f, tt, 0.35, 0.3); env(o.g, tt, 0.01, 0.3, 0.32); const h = osc('sine', f * 2, tt, 0.3, 0.1); env(h.g, tt, 0.01, 0.25, 0.1); }); },
    defeat(t) { const seq = [392, 349, 311, 262]; seq.forEach((f, i) => { const tt = t + i * 0.3; const o = osc('sawtooth', f, tt, 0.5, 0.18, f * 0.94); env(o.g, tt, 0.02, 0.45, 0.2); }); },
    gong(t) { const o = osc('sine', 180, t, 1.8, 0.5, 160); env(o.g, t, 0.005, 1.6, 0.6); const o2 = osc('triangle', 270, t, 1.4, 0.2, 250); env(o2.g, t, 0.005, 1.2, 0.25); const n = noiseBurst(t, 0.3, 0.3, 'bandpass', 1200, 200); env(n.g, t, 0.003, 0.25, 0.35); },
    boss_intro(t) { const o = osc('sawtooth', 70, t, 1.2, 0.35, 55); env(o.g, t, 0.05, 1.0, 0.4); const o2 = osc('square', 140, t + 0.2, 0.8, 0.12, 100); env(o2.g, t + 0.2, 0.05, 0.7, 0.15); const n = noiseBurst(t, 1.0, 0.3, 'lowpass', 600, 150); env(n.g, t, 0.1, 0.8, 0.3); },
    unlock(t) { [660, 880, 1100, 1320, 1760].forEach((f, i) => { const tt = t + i * 0.09; const o = osc('triangle', f, tt, 0.4, 0.28); env(o.g, tt, 0.005, 0.35, 0.3); }); },
    levelup(t) { [523, 659, 784, 1047].forEach((f, i) => { const tt = t + i * 0.1; const o = osc('square', f, tt, 0.25, 0.12); env(o.g, tt, 0.005, 0.2, 0.14); const s = osc('sine', f, tt, 0.4, 0.25); env(s.g, tt, 0.005, 0.35, 0.3); }); },
    fire(t) { const n = noiseBurst(t, 0.6, 0.4, 'lowpass', 900, 300, 0.7); env(n.g, t, 0.03, 0.5, 0.45); const o = osc('sawtooth', 90, t, 0.5, 0.15, 50); env(o.g, t, 0.02, 0.45, 0.2); },
    ice(t) { const n = noiseBurst(t, 0.5, 0.3, 'highpass', 4000); env(n.g, t, 0.01, 0.4, 0.35); [2500, 3200, 4100].forEach((f, i) => { const o = osc('sine', f, t + i * 0.05, 0.3, 0.12); env(o.g, t + i * 0.05, 0.005, 0.25, 0.14); }); },
    lightning(t) { const n = noiseBurst(t, 0.35, 0.5, 'highpass', 1500); env(n.g, t, 0.003, 0.3, 0.55); const o = osc('square', 60, t, 0.3, 0.25, 40); env(o.g, t, 0.003, 0.25, 0.3); },
    earth(t) { const o = osc('sine', 60, t, 0.7, 0.8, 25); env(o.g, t, 0.01, 0.6, 0.9); const n = noiseBurst(t, 0.6, 0.5, 'lowpass', 500, 80); env(n.g, t, 0.01, 0.5, 0.6); },
    energy(t) { const o = osc('sine', 300, t, 0.6, 0.3, 1200); env(o.g, t, 0.05, 0.5, 0.35); const o2 = osc('triangle', 150, t, 0.6, 0.2, 600); env(o2.g, t, 0.05, 0.5, 0.25); },
    burst(t) { const o = osc('sine', 200, t, 0.5, 0.6, 30); env(o.g, t, 0.005, 0.45, 0.7); const n = noiseBurst(t, 0.5, 0.5, 'bandpass', 800, 100, 0.6); env(n.g, t, 0.005, 0.4, 0.6); },
    step(t) { const n = noiseBurst(t, 0.06, 0.12, 'lowpass', 900, 300); env(n.g, t, 0.003, 0.05, 0.12); },
    throw(t) { const n = noiseBurst(t, 0.2, 0.25, 'bandpass', 2500, 900, 1.5); env(n.g, t, 0.005, 0.17, 0.3); },
    combo(t) { const o = osc('triangle', 1200, t, 0.12, 0.2, 1800); env(o.g, t, 0.003, 0.1, 0.22); },
    gift(t) { [784, 988, 1175, 1568].forEach((f, i) => { const tt = t + i * 0.08; const o = osc('triangle', f, tt, 0.3, 0.25); env(o.g, tt, 0.005, 0.25, 0.28); }); },
    buy(t) { [880, 1175, 1760].forEach((f, i) => { const tt = t + i * 0.07; const o = osc('sine', f, tt, 0.25, 0.25); env(o.g, tt, 0.005, 0.2, 0.28); }); },
    error(t) { const o = osc('square', 220, t, 0.18, 0.15, 180); env(o.g, t, 0.005, 0.15, 0.18); const o2 = osc('square', 220, t + 0.2, 0.18, 0.15, 160); env(o2.g, t + 0.2, 0.005, 0.15, 0.18); },
  };

  const lastPlay = {};
  function play(name, opts = {}) {
    if (!ctx || !unlocked) return;
    if (!NT.Save.get().settings.sfx) return;
    const now = performance.now();
    const minGap = opts.minGap != null ? opts.minGap : 35;
    if (lastPlay[name] && now - lastPlay[name] < minGap) return;
    lastPlay[name] = now;
    const t = ctx.currentTime + (opts.delay || 0);
    if (buffers[name]) {
      const s = ctx.createBufferSource(); s.buffer = buffers[name];
      const g = ctx.createGain(); g.gain.value = opts.volume != null ? opts.volume : 1;
      s.playbackRate.value = opts.rate || 1;
      s.connect(g); g.connect(sfxGain); s.start(t);
      return;
    }
    const fn = SYNTH[name];
    if (fn) { try { fn(t); } catch (e) { /* ignore */ } }
  }

  // ---------- procedural music ----------
  let music = { track: null, timer: null, step: 0, nextTime: 0, pending: null };
  const TRACKS = {
    menu: { bpm: 96, drone: 110, scale: [0, 2, 4, 7, 9], pattern: 'menu' },
    battle: { bpm: 128, drone: 82, scale: [0, 3, 5, 7, 10], pattern: 'battle' },
    boss: { bpm: 140, drone: 65, scale: [0, 1, 5, 7, 8], pattern: 'boss' },
    victory: null,
  };
  function playMusic(name) {
    if (!name || !TRACKS[name]) { stopMusic(); return; }
    if (music.track === name) return;
    if (!ctx || !unlocked) { music.pending = name; return; }
    stopMusic();
    music.track = name; music.step = 0; music.nextTime = ctx.currentTime + 0.05;
    music.timer = setInterval(schedule, 90);
    schedule();
  }
  function startMusicIfPending() { if (music.pending) { const p = music.pending; music.pending = null; playMusic(p); } }
  function stopMusic() { if (music.timer) clearInterval(music.timer); music.timer = null; music.track = null; }
  function drum(t, kind) {
    if (kind === 'taiko') { const o = osc('sine', 110, t, 0.35, 0.9, 45, musicGain); env(o.g, t, 0.004, 0.3, 0.9); const n = noiseBurst(t, 0.12, 0.35, 'lowpass', 900, 200, 1, musicGain); env(n.g, t, 0.003, 0.1, 0.35); }
    else if (kind === 'low') { const o = osc('sine', 70, t, 0.5, 1.0, 35, musicGain); env(o.g, t, 0.004, 0.45, 1.0); }
    else if (kind === 'click') { const n = noiseBurst(t, 0.05, 0.25, 'highpass', 5000, null, 1, musicGain); env(n.g, t, 0.002, 0.04, 0.25); }
    else if (kind === 'snap') { const n = noiseBurst(t, 0.12, 0.4, 'bandpass', 2200, 800, 1.2, musicGain); env(n.g, t, 0.002, 0.1, 0.4); const o = osc('triangle', 380, t, 0.08, 0.3, 200, musicGain); env(o.g, t, 0.002, 0.07, 0.3); }
  }
  function pluck(t, f, dur = 0.5, vol = 0.18) { const o = osc('triangle', f, t, dur, vol, null, musicGain); env(o.g, t, 0.01, dur * 0.8, vol); const h = osc('sine', f * 2, t, dur * 0.6, vol * 0.3, null, musicGain); env(h.g, t, 0.01, dur * 0.5, vol * 0.3); }
  function schedule() {
    if (!music.track || !ctx) return;
    const tr = TRACKS[music.track];
    const beat = 60 / tr.bpm / 2; // 8th notes
    while (music.nextTime < ctx.currentTime + 0.35) {
      const s = music.step, t = music.nextTime, bar = s % 16;
      if (tr.pattern === 'menu') {
        if (bar === 0) { const o = osc('sine', tr.drone, t, beat * 16, 0.12, null, musicGain); env(o.g, t, 0.5, beat * 14, 0.12, 0.08, 0.5); }
        if (bar % 4 === 0) drum(t, 'taiko');
        if (bar === 6 || bar === 14) drum(t, 'click');
        if ([0, 3, 6, 10, 12].includes(bar) && Math.random() < 0.8) { const deg = tr.scale[Math.floor(Math.random() * tr.scale.length)]; pluck(t, tr.drone * 4 * Math.pow(2, deg / 12), beat * 3, 0.12); }
      } else if (tr.pattern === 'battle') {
        if (bar === 0 || bar === 8) { const o = osc('sawtooth', tr.drone, t, beat * 8, 0.05, null, musicGain); env(o.g, t, 0.05, beat * 7, 0.05, 0.03, 0.2); }
        if ([0, 3, 6, 8, 10, 13].includes(bar)) drum(t, 'taiko');
        if (bar === 4 || bar === 12) drum(t, 'snap');
        if (bar % 2 === 1) drum(t, 'click');
        if ((bar === 2 || bar === 9 || bar === 14) && Math.random() < 0.7) { const deg = tr.scale[Math.floor(Math.random() * tr.scale.length)]; pluck(t, tr.drone * 4 * Math.pow(2, deg / 12), beat * 2, 0.1); }
      } else if (tr.pattern === 'boss') {
        if (bar === 0 || bar === 8) { const o = osc('sawtooth', tr.drone, t, beat * 8, 0.07, null, musicGain); env(o.g, t, 0.05, beat * 7, 0.07, 0.04, 0.2); const o2 = osc('square', tr.drone * 1.5, t, beat * 8, 0.03, null, musicGain); env(o2.g, t, 0.05, beat * 7, 0.03, 0.02, 0.2); }
        if ([0, 2, 3, 6, 8, 10, 11, 14].includes(bar)) drum(t, 'taiko');
        if (bar === 4 || bar === 12) drum(t, 'low');
        if (bar % 2 === 1) drum(t, 'click');
        if ((bar === 1 || bar === 5 || bar === 9 || bar === 13) && Math.random() < 0.8) { const deg = tr.scale[Math.floor(Math.random() * tr.scale.length)]; pluck(t, tr.drone * 4 * Math.pow(2, deg / 12), beat * 1.5, 0.09); }
      }
      music.nextTime += beat; music.step++;
    }
  }

  function duck(amount = 0.3, dur = 1.5) { if (!ctx) return; const t = ctx.currentTime; musicGain.gain.cancelScheduledValues(t); const base = NT.Save.get().settings.music ? 0.55 : 0; musicGain.gain.setValueAtTime(base * amount, t); musicGain.gain.linearRampToValueAtTime(base, t + dur); }

  return { unlock, play, playMusic, stopMusic, applySettings, duck, MANIFEST, get ready() { return unlocked; } };
})();

</script>
<script>
/* ============================================================
   NT.Input — multitouch pointer tracking + keyboard mapping
   Scenes receive pointer events; UI layers manage buttons.
   ============================================================ */
NT.Input = (function () {
  const pointers = new Map(); // id -> {id,x,y,sx,sy,st,target,moved}
  const keys = new Set();
  const keyPressed = new Set(); // edge-triggered (consumed per frame)
  let canvas = null;
  let handler = null; // current scene
  let lastInputWasTouch = false;

  function toLocal(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function init(c) {
    canvas = c;
    canvas.style.touchAction = 'none';
    const opt = { passive: false };
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      lastInputWasTouch = e.pointerType === 'touch';
      const p = toLocal(e);
      const ptr = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, st: performance.now(), target: null, moved: false, type: e.pointerType };
      pointers.set(e.pointerId, ptr);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      NT.Audio.unlock();
      if (handler && handler.onPointerDown) handler.onPointerDown(ptr);
    }, opt);
    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      const ptr = pointers.get(e.pointerId);
      if (!ptr) return;
      const p = toLocal(e);
      ptr.x = p.x; ptr.y = p.y;
      if (Math.hypot(ptr.x - ptr.sx, ptr.y - ptr.sy) > 8) ptr.moved = true;
      if (handler && handler.onPointerMove) handler.onPointerMove(ptr);
    }, opt);
    const up = (e) => {
      e.preventDefault();
      const ptr = pointers.get(e.pointerId);
      if (!ptr) return;
      const p = toLocal(e);
      ptr.x = p.x; ptr.y = p.y;
      pointers.delete(e.pointerId);
      if (handler && handler.onPointerUp) handler.onPointerUp(ptr);
    };
    canvas.addEventListener('pointerup', up, opt);
    canvas.addEventListener('pointercancel', up, opt);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      lastInputWasTouch = false;
      keys.add(e.code);
      keyPressed.add(e.code);
      NT.Audio.unlock();
      if (handler && handler.onKeyDown) handler.onKeyDown(e.code);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys.delete(e.code); });
    window.addEventListener('blur', () => { keys.clear(); pointers.clear(); if (handler && handler.onBlur) handler.onBlur(); });
  }

  function setHandler(h) { handler = h; pointers.clear(); }
  function isDown(code) { return keys.has(code); }
  function consumePressed(code) { const v = keyPressed.has(code); keyPressed.delete(code); return v; }
  function endFrame() { keyPressed.clear(); }

  // keyboard movement vector
  function keyAxis() {
    let x = 0, y = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
    const l = Math.hypot(x, y);
    if (l > 0) { x /= l; y /= l; }
    return { x, y, active: l > 0 };
  }

  return { init, setHandler, pointers, isDown, consumePressed, endFrame, keyAxis, get touch() { return lastInputWasTouch; } };
})();

</script>
<script>
/* ============================================================
   NT.SceneManager — scene stack with transitions
   Scene interface: enter(params), exit(), update(dt), render(ctx),
   onPointerDown/Move/Up(ptr), onKeyDown(code), resize(w,h)
   ============================================================ */
NT.SceneManager = (function () {
  let current = null;
  let next = null;
  let nextParams = null;
  let trans = { active: false, t: 0, dur: 0.45, phase: 0, type: 'fade' }; // phase 0 = out, 1 = in
  let overlays = []; // modal overlays (pause, settings)

  function go(scene, params, type = 'fade', dur = 0.45) {
    if (trans.active && trans.phase === 0) { next = scene; nextParams = params; return; }
    next = scene; nextParams = params;
    trans = { active: true, t: 0, dur, phase: 0, type };
    NT.Audio.play('whoosh');
  }
  function replaceImmediate(scene, params) {
    if (current && current.exit) current.exit();
    current = scene;
    overlays = [];
    NT.Input.setHandler(dispatcher);
    if (current.enter) current.enter(params || {});
    if (current.resize) current.resize(NT.Game.W, NT.Game.H);
  }

  function pushOverlay(o) { overlays.push(o); if (o.enter) o.enter(); }
  function popOverlay() { const o = overlays.pop(); if (o && o.exit) o.exit(); return o; }
  function topOverlay() { return overlays[overlays.length - 1] || null; }

  const dispatcher = {
    onPointerDown(p) { const t = topOverlay() || current; if (t && t.onPointerDown) t.onPointerDown(p); },
    onPointerMove(p) { const t = topOverlay() || current; if (t && t.onPointerMove) t.onPointerMove(p); },
    onPointerUp(p) { const t = topOverlay() || current; if (t && t.onPointerUp) t.onPointerUp(p); },
    onKeyDown(c) { const t = topOverlay() || current; if (t && t.onKeyDown) t.onKeyDown(c); },
    onBlur() { const t = topOverlay() || current; if (t && t.onBlur) t.onBlur(); },
  };

  function update(dt) {
    if (trans.active) {
      trans.t += dt;
      if (trans.phase === 0 && trans.t >= trans.dur) {
        replaceImmediate(next, nextParams);
        next = null;
        trans.phase = 1; trans.t = 0;
      } else if (trans.phase === 1 && trans.t >= trans.dur) {
        trans.active = false;
      }
    }
    const top = topOverlay();
    if (top) { if (top.update) top.update(dt); if (top.blocksUpdate === false && current && current.update) current.update(dt); }
    else if (current && current.update && !(trans.active && trans.phase === 0 && trans.t > trans.dur * 0.9)) current.update(dt);
  }

  function render(ctx) {
    if (current && current.render) current.render(ctx);
    for (const o of overlays) if (o.render) o.render(ctx);
    if (trans.active) {
      const W = NT.Game.W, H = NT.Game.H;
      let a = trans.phase === 0 ? trans.t / trans.dur : 1 - trans.t / trans.dur;
      a = NT.Util.clamp(a, 0, 1);
      if (trans.type === 'iris') {
        // circular iris wipe (gold rim)
        const maxR = Math.hypot(W, H) * 0.6;
        const r = maxR * (1 - NT.Util.ease.inOutQuad(a));
        ctx.save();
        ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, Math.max(0, r), 0, Math.PI * 2, true);
        ctx.fillStyle = '#0a0612'; ctx.fill('evenodd');
        if (r > 0 && r < maxR) { ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#e0b14a'; ctx.stroke(); }
        ctx.restore();
      } else {
        ctx.fillStyle = `rgba(6,3,12,${a})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  function resize(w, h) { if (current && current.resize) current.resize(w, h); for (const o of overlays) if (o.resize) o.resize(w, h); }

  return { go, replaceImmediate, update, render, resize, pushOverlay, popOverlay, topOverlay, get current() { return current; }, get transitioning() { return trans.active; } };
})();

</script>
<script>
/* ============================================================
   NT.Camera — perspective camera over the arena plane.
   World: x right, z toward viewer (down the screen), y up.
   ============================================================ */
NT.Camera = class Camera {
  constructor() {
    this.x = 0; this.z = 0;           // look-at point on ground
    this.tx = 0; this.tz = 0;         // target
    this.H = 960; this.D = 820;       // eye height & distance behind look-at
    this.zoom = 1; this.tzoom = 1;
    this.shakeAmp = 0; this.shakeT = 0; this.shakeX = 0; this.shakeY = 0;
    this.W = 800; this.Hs = 600; this.cx = 400; this.cy = 330;
    this.baseFocal = 1;
    this.bounds = null; // {x, z, r} circle
    this.recalc();
  }
  resize(W, H) {
    this.W = W; this.Hs = H;
    this.cx = W / 2; this.cy = H * 0.5;
    // scale so that ~880 world units fit the screen width on landscape, ~620 on portrait
    const landscape = W >= H;
    const fitW = landscape ? 1340 : 860;
    this.baseFocal = (W / fitW) * this.L;
    this.recalc();
  }
  recalc() {
    this.L = Math.hypot(this.H, this.D);
    this.focal = (this.baseFocal || this.L) * this.zoom;
    this.L2 = this.L * this.L;
  }
  // scale factor k for ground row at dz (world z - cam z)
  kAt(dz) { return (this.focal * this.L) / (this.L2 - dz * this.D); }
  project(x, y, z) {
    const dz = z - this.z;
    const dx = x - this.x;
    const L = this.L, D = this.D, Hc = this.H;
    const pz = (-(y - Hc) * Hc - (dz - D) * D) / L;
    const py = ((y - Hc) * D - (dz - D) * Hc) / L;
    const inv = this.focal / Math.max(40, pz);
    return { x: this.cx + dx * inv + this.shakeX, y: this.cy - py * inv + this.shakeY, k: inv, pz };
  }
  // inverse ground mapping for a screen row (returns dz)
  dzForScreenY(sy) {
    const d = sy - this.shakeY - this.cy;
    return (d * this.L2) / (this.focal * this.H + d * this.D);
  }
  horizonY() { return this.cy - (this.focal * this.H) / this.D + this.shakeY; }

  shake(amp, dur = 0.3) { if (!NT.Save.get().settings.shake) amp *= 0.25; this.shakeAmp = Math.max(this.shakeAmp, amp); this.shakeT = Math.max(this.shakeT, dur); }

  update(dt) {
    const U = NT.Util;
    let tx = this.tx, tz = this.tz;
    if (this.bounds) {
      // keep the camera from drifting too far outside the arena
      const b = this.bounds, dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz), max = b.r * 0.55;
      if (d > max) { tx = b.x + (dx / d) * max; tz = b.z + (dz / d) * max; }
    }
    this.x = U.damp(this.x, tx, 6, dt);
    this.z = U.damp(this.z, tz, 6, dt);
    this.zoom = U.damp(this.zoom, this.tzoom, 4, dt);
    this.recalc();
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const a = this.shakeAmp * Math.min(1, this.shakeT * 4);
      this.shakeX = (Math.random() * 2 - 1) * a;
      this.shakeY = (Math.random() * 2 - 1) * a;
      if (this.shakeT <= 0) { this.shakeAmp = 0; this.shakeX = this.shakeY = 0; }
    }
  }
  snap() { this.x = this.tx; this.z = this.tz; this.zoom = this.tzoom; this.recalc(); }
};

</script>

<script>
/* ============================================================
   NT.Tournament — the Tournament of Elements structure.
   Each arena has 5 rounds; each round = waves of grunts followed
   by a champion (an elemental master / villain). Round 5's
   champion is the arena boss. Defeating a champion unlocks them.
   ============================================================ */
NT.Tournament = (function () {
  const ROUNDS = 5;
  const champions = {
    chens_arena:      ['kapau', 'chope', 'karlof', 'eyezor', 'clouse'],
    chens_palace:     ['griffin', 'ash', 'zugu', 'skylor', 'chen'],
    jungle_ruins:     ['bolobo', 'tox', 'shade', 'chamille', 'pythor'],
    skulkin_caves:    ['krazi', 'nuckal', 'kruncha', 'frakjaw', 'samukai'],
    dark_island:      ['jacob', 'gravis', 'kozu', 'neuro', 'lord_garmadon'],
    ninjago_city:     ['min_droid', 'paleman', 'dareth', 'pixal', 'cryptor'],
    anacondrai_arena: ['wu', 'nya', 'lord_garmadon', 'clouse', 'chen_anacondrai'],
  };
  const arenaOrder = NT.Arenas.list.map((a) => a.id);

  function arenaIndex(id) { return arenaOrder.indexOf(id); }
  function difficulty(arenaId, round) { return 1 + arenaIndex(arenaId) * 0.28 + round * 0.09; }

  // Build the wave plan for a round
  function plan(arenaId, round) {
    const arena = NT.Arenas.get(arenaId);
    const ai = arenaIndex(arenaId);
    const rng = NT.Util.seeded(ai * 100 + round * 7 + 13);
    const waveCount = round === 4 ? 3 : 2 + Math.floor(round / 2);
    const waves = [];
    for (let w = 0; w < waveCount; w++) {
      const count = Math.min(7, 2 + Math.floor(round * 0.8) + w + Math.floor(ai / 2));
      const enemies = [];
      for (let i = 0; i < count; i++) enemies.push(arena.pool[Math.floor(rng() * arena.pool.length)]);
      if ((w === waveCount - 1 && round >= 2) || (ai >= 3 && w >= 1 && rng() < 0.5)) enemies.push(arena.heavy);
      waves.push({ enemies, maxConcurrent: Math.min(6, 3 + Math.floor(round / 2) + Math.floor(ai / 3)) });
    }
    return { arenaId, round, waves, champion: champions[arenaId][round], boss: round === ROUNDS - 1, difficulty: difficulty(arenaId, round) };
  }

  function isArenaUnlocked(arenaId) {
    const i = arenaIndex(arenaId);
    if (i === 0) return true;
    const prev = arenaOrder[i - 1];
    return NT.Save.arenaProgress(prev).cleared >= ROUNDS;
  }
  function isArenaComplete(arenaId) { return NT.Save.arenaProgress(arenaId).cleared >= ROUNDS; }
  function isTournamentComplete() { return arenaOrder.every(isArenaComplete); }

  function reward(arenaId, round, combo, hearts) {
    const d = difficulty(arenaId, round);
    const base = Math.round(1500 * d * (1 + round * 0.35));
    const comboBonus = Math.round(Math.min(combo, 150) * 12 * d);
    const xp = Math.round(120 * d * (1 + round * 0.3) + (round === ROUNDS - 1 ? 200 : 0));
    return { studs: base, comboBonus, xp };
  }

  return { ROUNDS, champions, arenaOrder, arenaIndex, difficulty, plan, isArenaUnlocked, isArenaComplete, isTournamentComplete, reward };
})();

</script>
<script>
/* ============================================================
   NT.Minifig — procedural LEGO minifigure renderer.
   Local space: feet at (0,0), up = -y, total height ~110 units.
   draw(ctx, look, pose, opts)
     pose: { bob, lean, legL, legR, armL, armR, armLFwd, armRFwd,
             headTilt, crouch, lying, weaponAngle, weaponHide, squash }
     opts: { facing (rad; 0 = +x, PI/2 = toward camera), flash, alpha,
             flat (single color), only (part), noShadowArm }
   ============================================================ */
NT.Minifig = (function () {
  const U = NT.Util;
  const HEIGHT = 110;
  const PART_CENTER = { head: [0, -90], torso: [0, -56], legs: [0, -18], armL: [-22, -56], armR: [22, -56], weapon: [30, -75] };

  function palette(look, flat) {
    if (flat) return new Proxy({}, { get: () => flat });
    if (look._pal) return look._pal;
    const p = {};
    p.skin = look.skin; p.skinD = U.shade(look.skin, -0.25);
    p.torso = look.torso; p.torsoD = U.shade(look.torso, -0.3); p.torsoL = U.shade(look.torso, 0.18);
    p.legs = look.legs; p.legsD = U.shade(look.legs, -0.3); p.legsL = U.shade(look.legs, 0.12);
    const bare = look.torsoPrint === 'ninja_tournament' || look.torsoPrint === 'vest';
    p.arms = look.arms || (bare ? look.skin : look.torso); p.armsD = U.shade(p.arms, -0.28);
    p.hands = look.hands || look.skin;
    p.accent = look.accent; p.accentD = U.shade(look.accent, -0.3);
    p.hair = look.hairColor; p.hairD = U.shade(look.hairColor, -0.3); p.hairL = U.shade(look.hairColor, 0.2);
    p.weapon = look.weaponColor; p.weaponD = U.shade(look.weaponColor, -0.35); p.weaponL = U.shade(look.weaponColor, 0.3);
    p.mask = look.mask || look.torso; p.maskD = U.shade(p.mask, -0.3);
    p.hood = look.hood || look.torso; p.hoodD = U.shade(p.hood, -0.3);
    p.ink = '#141414'; p.white = '#ffffff'; p.gold = '#e0b14a'; p.goldD = '#9a7420';
    look._pal = p;
    return p;
  }

  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();

  // ---------------- LEGS ----------------
  function drawLegs(ctx, p, pose, front) {
    const dir = front ? 1 : -1;
    const crouch = pose.crouch || 0;
    const legH = 30 - crouch * 9;
    const hipY = -38 + crouch * 9;
    // hips
    ctx.fillStyle = p.legsD; rr(ctx, -16, hipY, 32, 9, 2); ctx.fill();
    ctx.fillStyle = p.legs; rr(ctx, -14, hipY + 1, 28, 6, 2); ctx.fill();
    const legs = [[-1, pose.legL || 0], [1, pose.legR || 0]];
    // draw back leg first
    legs.sort((a, b) => (a[1] * dir) - (b[1] * dir));
    for (const [side, v] of legs) {
      const fwd = v * dir; // + = toward camera
      const h = legH * (1 - 0.22 * Math.abs(v));
      const x = side * 8 + v * (pose.sideStep || 0) * 6;
      const top = hipY + 8;
      const bottom = top + h + fwd * 5;
      const w = 14;
      ctx.fillStyle = fwd < -0.2 ? p.legsD : p.legs;
      rr(ctx, x - w / 2, top, w, Math.max(6, bottom - top), 2); ctx.fill();

  // ---------------- TORSO ----------------

  // ---------------- ARMS ----------------
  function drawArm(ctx, p, side, angle, fwd, opts) {
    // side: -1 left, +1 right ; angle: 0 down, + raised outward ; fwd 0..1 toward camera
    const sx = side * 18 + (opts.shoulderY ? 0 : 0);
    const sy = opts.shoulderY || -68;

  // ---------------- HEAD ----------------
  function drawHead(ctx, p, look, pose, front, fxAbs) {

      ctx.fillStyle = look.face === 'skull' && look.accent === '#c8102e' ? '#ff3b3b' : '#ffe14a'; ctx.beginPath(); ctx.arc(cx - 6 + eyeShift, top + 11, 1.6, 0, U.TAU); ctx.arc(cx + 6 + eyeShift, top + 11, 1.6, 0, U.TAU); ctx.fill();

<script>
/* ============================================================
   NT.EnemyAI — grunt / ranged / heavy / boss behaviours.
   Uses "attack tokens" so only a few enemies attack at once and
   the rest circle, wait and reposition.
   ============================================================ */
NT.EnemyAI = class EnemyAI {
  constructor(f, opts = {}) {
    this.f = f; this.p = Object.assign({ aggression: 0.5, attackRate: 1.2, range: 64, ranged: false, blocks: 0, kind: 'grunt' }, opts.ai || {});
    this.isBoss = !!opts.boss;

    this.strafeDir = Math.random() < 0.5 ? 1 : -1; this.waitT = 0; this.thinkT = 0;

    this.phase = 1; this.blockT = 0; this.dodgeCool = 0;
    this.enraged = false;

  release(world) { if (this.token) { this.token = false; world.aiTokens = Math.max(0, world.aiTokens - 1); } }
  update(dt, world) {

    if (f.state === 'intro' || f.state === 'frozen') { f.moveInput.x = f.moveInput.z = 0; return; }
    if (f.state === 'attack' || f.state === 'special') { f.moveInput.x = f.moveInput.z = 0; return; }

/* ============================================================
   NT.PlayerController — touch joystick + buttons + keyboard →
   fighter actions. Multitouch: move & attack simultaneously.
   ============================================================ */
NT.PlayerController = class PlayerController {
  constructor(fighter, hud) {
    this.f = fighter; this.hud = hud;
    this.flickT = 0; this.lastFlick = 0; this.blockKey = false;
  }
  update(dt, world) {
    const f = this.f; if (!f) return;
    const In = NT.Input; const joy = this.hud.joystick;
    let mx = 0, mz = 0;
    if (joy.active && joy.mag > 0.12) { mx = joy.dx; mz = joy.dy; }
    else { const k = In.keyAxis(); if (k.active) { mx = k.x; mz = k.y; } }
    f.moveInput.x = mx; f.moveInput.z = mz;
    // joystick flick → dodge
    if (joy.flick) { joy.flick = false; f.moveInput.x = joy.flickX; f.moveInput.z = joy.flickY; f.tryAttack(world, 'dodge'); }
    // keyboard actions (edge-triggered)
    if (In.consumePressed('KeyJ') || In.consumePressed('KeyZ') || In.consumePressed('Enter')) this.press('attack', world);
    if (In.consumePressed('KeyK') || In.consumePressed('KeyX')) this.press('kick', world);
    if (In.consumePressed('KeyL') || In.consumePressed('KeyC')) this.press('jumpslam', world);
    if (In.consumePressed('Space')) this.press('special', world);
    if (In.consumePressed('ShiftLeft') || In.consumePressed('ShiftRight') || In.consumePressed('KeyV')) this.press('dodge', world);
    const blockKey = In.isDown('KeyU') || In.isDown('KeyB') || In.isDown('ControlLeft');
    const blockBtn = this.hud.held.block;
    f.setBlock(blockKey || blockBtn, world);
  }
  press(action, world) {
    const f = this.f; if (!f || f.dead) return;
    switch (action) {
      case 'attack': f.tryAttack(world, 'light'); break;
      case 'kick': f.tryAttack(world, 'kick'); break;
      case 'jumpslam': f.tryAttack(world, 'jumpslam'); break;
      case 'special': f.tryAttack(world, 'special'); break;
      case 'dodge': f.tryAttack(world, 'dodge'); break;
    }
  }
};

<script>
/* ============================================================
   NT.Progression — XP / True Potential levels, unlocks, shop,
   rewards, daily gift.
   ============================================================ */
NT.Progression = (function () {
  const LEVELS = [0, 750, 2000, 4000, 7000]; // xp needed to go from level i+1 to i+2 (index = level-1)
  const RANKS = ['Novice', 'Apprentice', 'Warrior', 'Master', 'Grandmaster'];
  const RANK_DESC = ['Starting level', 'Learning the way', 'Battle hardened', 'Master of the element', 'True Potential unlocked'];
  const MAX_LEVEL = 5;

  function xpToNext(level) { return level >= MAX_LEVEL ? null : LEVELS[level]; }
  function levelInfo(charId) { const l = NT.Save.charLevel(charId); return { level: l.level, xp: l.xp, next: xpToNext(l.level), rank: RANKS[l.level - 1], desc: RANK_DESC[l.level - 1] }; }
  function addXp(charId, amount) {
    const l = NT.Save.charLevel(charId); let gained = 0;
    if (l.level >= MAX_LEVEL) { l.xp = 0; NT.Save.save(); return { gained, level: l.level }; }
    l.xp += amount;
    while (l.level < MAX_LEVEL && l.xp >= LEVELS[l.level]) { l.xp -= LEVELS[l.level]; l.level++; gained++; }
    if (l.level >= MAX_LEVEL) l.xp = 0;
    NT.Save.save();
    return { gained, level: l.level };
  }

  function isUnlocked(charId) { return !!NT.Save.get().unlocked[charId]; }
  function unlock(charId) { const d = NT.Save.get(); if (d.unlocked[charId]) return false; d.unlocked[charId] = true; NT.Save.save(); return true; }
  function price(def) { return def.unlock.price != null ? def.unlock.price : 0; }
  function canBuy(def) { return !isUnlocked(def.id) && def.unlock.type !== 'default' && NT.Save.get().studs >= price(def); }
  function buy(def) { if (!canBuy(def)) return false; const d = NT.Save.get(); d.studs -= price(def); d.unlocked[def.id] = true; NT.Save.save(); return true; }
  function unlockText(def) {
    if (isUnlocked(def.id)) return null;
    if (def.unlock.type === 'boss') { const a = NT.Arenas.get(def.unlock.arena); return `Defeat in ${a.name} · Round ${def.unlock.round + 1}`; }
    return 'Available in the shop';
  }

  // called after a round victory
  function awardVictory(plan, result) {
    const d = NT.Save.get();
    const rw = NT.Tournament.reward(plan.arenaId, plan.round, result.maxCombo, result.hearts);
    const studs = rw.studs + rw.comboBonus + result.studsCollected;
    d.studs += studs; d.stats.studsEarned += studs; d.stats.wins++; d.stats.battles++; d.stats.kills += result.kills;
    if (result.maxCombo > d.stats.maxCombo) d.stats.maxCombo = result.maxCombo;
    const prog = NT.Save.arenaProgress(plan.arenaId);
    const unlocks = [];
    if (prog.cleared <= plan.round) prog.cleared = plan.round + 1;
    // champion unlock
    const champ = NT.Characters.get(plan.champion);
    if (champ && champ.unlock.type === 'boss' && champ.unlock.arena === plan.arenaId && champ.unlock.round === plan.round && unlock(champ.id)) unlocks.push({ type: 'character', id: champ.id, name: champ.name });
    // arena unlock
    const ai = NT.Tournament.arenaIndex(plan.arenaId);
    if (plan.round === NT.Tournament.ROUNDS - 1 && ai + 1 < NT.Tournament.arenaOrder.length) { const na = NT.Arenas.get(NT.Tournament.arenaOrder[ai + 1]); unlocks.push({ type: 'arena', id: na.id, name: na.name }); d.currentArena = na.id; d.currentRound = 0; }
    else if (plan.round < NT.Tournament.ROUNDS - 1) { d.currentArena = plan.arenaId; d.currentRound = Math.max(d.currentRound, plan.round + 1); if (d.currentArena !== plan.arenaId) d.currentRound = plan.round + 1; }
    const xp = addXp(result.charId, rw.xp);
    NT.Save.save();
    return { studs, base: rw.studs, comboBonus: rw.comboBonus, collected: result.studsCollected, xp: rw.xp, levelsGained: xp.gained, level: xp.level, unlocks };
  }
  function awardDefeat(result) {
    const d = NT.Save.get(); const studs = Math.floor(result.studsCollected * 0.5);
    d.studs += studs; d.stats.losses++; d.stats.battles++; d.stats.kills += result.kills; NT.Save.save();
    return { studs };
  }

  // daily gift
  const GIFT_INTERVAL = 20 * 60 * 60 * 1000;
  function giftReady() { return Date.now() - NT.Save.get().lastGift >= GIFT_INTERVAL; }
  function giftCountdown() { const ms = GIFT_INTERVAL - (Date.now() - NT.Save.get().lastGift); if (ms <= 0) return 'READY'; const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000); return `${h}h ${m}m`; }
  function claimGift() {
    if (!giftReady()) return null;
    const d = NT.Save.get(); d.giftStreak = (d.giftStreak || 0) + 1; d.lastGift = Date.now();
    const table = [5000, 8000, 12000, 20000, 30000, 50000];
    const amount = table[Math.min(table.length - 1, d.giftStreak - 1)] + Math.floor(Math.random() * 3) * 1000;
    d.studs += amount; NT.Save.save();
    return { studs: amount, streak: d.giftStreak };
  }

  return { LEVELS, RANKS, RANK_DESC, MAX_LEVEL, xpToNext, levelInfo, addXp, isUnlocked, unlock, price, canBuy, buy, unlockText, awardVictory, awardDefeat, giftReady, giftCountdown, claimGift };
})();

<script>

      const p = this.pop(); ctx.save(); ctx.translate(this.cx, this.cy); ctx.scale(p, p); ctx.translate(-this.cx, -this.cy);
      const pw = Math.min(520, W * 0.8) * this.s / Math.max(0.8, this.s), ph = 330 * this.s;
      UI.panel(ctx, this.cx - pw / 2, this.cy - ph / 2 - 20 * this.s, pw, ph + 40 * this.s);
      UI.scroll(ctx, this.cx, this.cy - ph / 2 - 20 * this.s, Math.min(400, pw * 0.85), 54 * this.s, 'PAUSED');
      this.ui.render(ctx);
      ctx.restore();
    }
  }

  class Settings extends Base {
    layout(W, H) {
      this.ui.clear(); const s = Math.max(0.75, Math.min(W / 900, H / 640)); this.s = s; const cx = W / 2, cy = H * 0.52; this.cx = cx; this.cy = cy;
      const st = NT.Save.get().settings;
      const rows = [['music', 'Music'], ['sfx', 'Sound Effects'], ['shake', 'Screen Shake'], ['leftHanded', 'Left-handed Controls'], ['showHints', 'Control Hints']];
      const rowH = 50 * s; const top = cy - rowH * 2.6;
      this.rows = rows; this.top = top; this.rowH = rowH;
      rows.forEach(([key, label], i) => this.ui.add({ id: key, x: cx + 150 * s, y: top + i * rowH, w: 120 * s, h: 40 * s, shape: 'rect', onTap: () => { st[key] = !st[key]; NT.Save.save(); NT.Audio.applySettings(); if (key === 'leftHanded' || key === 'showHints') NT.Game.notifySettings(); }, draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, st[key] ? 'ON' : 'OFF', { press: b.press, color: st[key] ? '#2a7a3a' : '#5a3a3a', size: b.h * 0.5 }) }));
      // button size
      this.ui.add({ id: 'size', x: cx + 150 * s, y: top + rows.length * rowH, w: 120 * s, h: 40 * s, shape: 'rect', onTap: () => { st.buttonSize = st.buttonSize >= 1.2 ? 0.85 : st.buttonSize >= 1 ? 1.2 : 1; NT.Save.save(); NT.Game.notifySettings(); }, draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, st.buttonSize >= 1.2 ? 'LARGE' : st.buttonSize >= 1 ? 'NORMAL' : 'SMALL', { press: b.press, size: b.h * 0.42 }) });
      this.ui.add({ id: 'reset', x: cx - 90 * s, y: top + (rows.length + 1.4) * rowH, w: 220 * s, h: 44 * s, shape: 'rect', onTap: () => NT.SceneManager.pushOverlay(new Confirm('Reset ALL progress?', 'Studs, unlocks and levels will be lost.', () => { NT.Save.reset(); NT.Audio.applySettings(); NT.Game.notifySettings(); NT.SceneManager.popOverlay(); NT.SceneManager.popOverlay(); NT.SceneManager.go(new NT.Scenes.Menu(), {}, 'fade'); })), draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, 'Reset Progress', { press: b.press, color: '#7a2a3a', size: b.h * 0.42 }) });
      this.ui.add({ id: 'close', x: cx + 150 * s, y: top + (rows.length + 1.4) * rowH, w: 140 * s, h: 44 * s, shape: 'rect', onTap: () => this.close(), draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, 'Close', { press: b.press, size: b.h * 0.45 }) });
    }
    onEscape() { this.close(); }
    render(ctx) {
      const W = NT.Game.W, H = NT.Game.H; this.dim(ctx, W, H, 0.7); const s = this.s;
      const p = this.pop(); ctx.save(); ctx.translate(this.cx, this.cy); ctx.scale(p, p); ctx.translate(-this.cx, -this.cy);
      const pw = Math.min(W * 0.92, 560 * s), ph = 460 * s;
      UI.panel(ctx, this.cx - pw / 2, this.cy - ph / 2, pw, ph);
      UI.scroll(ctx, this.cx, this.cy - ph / 2, Math.min(pw * 0.8, 360 * s), 52 * s, 'SETTINGS');
      this.rows.forEach(([key, label], i) => UI.goldText(ctx, label, this.cx - 60 * s, this.top + i * this.rowH, 20 * s, { align: 'right' }));
      UI.goldText(ctx, 'Button Size', this.cx - 60 * s, this.top + this.rows.length * this.rowH, 20 * s, { align: 'right' });
      this.ui.render(ctx);
      UI.text(ctx, 'Keyboard: WASD/Arrows move · J attack · K kick · L jump slam · U block · Shift dodge · Space Spinjitzu · Esc pause', this.cx, this.cy + ph / 2 - 22 * s, { size: 11 * s, color: 'rgba(255,240,200,0.7)', weight: 'normal' });
      ctx.restore();
    }
  }

  class Confirm extends Base {
    constructor(title, msg, onYes, onNo) { super(); this.title = title; this.msg = msg; this.onYes = onYes; this.onNo = onNo; }
    layout(W, H) {
      this.ui.clear(); const s = Math.max(0.75, Math.min(W / 900, H / 640)); this.s = s; const cx = W / 2, cy = H / 2; this.cx = cx; this.cy = cy;
      this.ui.add({ id: 'yes', x: cx - 90 * s, y: cy + 60 * s, w: 150 * s, h: 46 * s, shape: 'rect', onTap: () => { if (this.onYes) this.onYes(); else this.close(); }, draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, 'Yes', { press: b.press, color: '#2a7a3a' }) });
      this.ui.add({ id: 'no', x: cx + 90 * s, y: cy + 60 * s, w: 150 * s, h: 46 * s, shape: 'rect', onTap: () => { this.close(); if (this.onNo) this.onNo(); }, draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, 'No', { press: b.press, color: '#7a2a3a' }) });
    }
    onEscape() { this.close(); }
    render(ctx) {
      const W = NT.Game.W, H = NT.Game.H; this.dim(ctx, W, H, 0.5); const s = this.s;
      const p = this.pop(); ctx.save(); ctx.translate(this.cx, this.cy); ctx.scale(p, p); ctx.translate(-this.cx, -this.cy);
      const pw = Math.min(W * 0.9, 480 * s), ph = 230 * s;
      UI.panel(ctx, this.cx - pw / 2, this.cy - ph / 2, pw, ph);
      UI.goldText(ctx, this.title, this.cx, this.cy - 55 * s, 26 * s);
      UI.text(ctx, this.msg, this.cx, this.cy - 10 * s, { size: 16 * s, color: '#fff' });
      this.ui.render(ctx); ctx.restore();
    }
  }

  class Message extends Base {
    constructor(title, lines, opts = {}) { super(); this.title = title; this.lines = Array.isArray(lines) ? lines : [lines]; this.opts = opts; }
    layout(W, H) {
      this.ui.clear(); const s = Math.max(0.75, Math.min(W / 900, H / 640)); this.s = s; const cx = W / 2, cy = H / 2; this.cx = cx; this.cy = cy;
      const ph = (170 + this.lines.length * 26 + (this.opts.icon ? 70 : 0)) * s; this.ph = ph;
      this.ui.add({ id: 'ok', x: cx, y: cy + ph / 2 - 42 * s, w: 160 * s, h: 46 * s, shape: 'rect', onTap: () => { this.close(); if (this.opts.onClose) this.opts.onClose(); }, draw: (ctx, b) => UI.pillButton(ctx, b.x, b.y, b.w, b.h, this.opts.button || 'OK', { press: b.press }) });
    }
    onEscape() { this.close(); if (this.opts.onClose) this.opts.onClose(); }
    render(ctx) {
      const W = NT.Game.W, H = NT.Game.H; this.dim(ctx, W, H, 0.55); const s = this.s;
      const p = this.pop(); ctx.save(); ctx.translate(this.cx, this.cy); ctx.scale(p, p); ctx.translate(-this.cx, -this.cy);
      const pw = Math.min(W * 0.9, 520 * s), ph = this.ph;
      UI.panel(ctx, this.cx - pw / 2, this.cy - ph / 2, pw, ph);
      UI.scroll(ctx, this.cx, this.cy - ph / 2, Math.min(pw * 0.8, 380 * s), 52 * s, this.title, { size: 22 * s });
      let y = this.cy - ph / 2 + 70 * s;
      if (this.opts.icon) { ctx.save(); ctx.translate(this.cx, y + 25 * s); ctx.scale(s * 0.7, s * 0.7); this.opts.icon(ctx); ctx.restore(); y += 70 * s; }
      if (this.opts.portrait) { NT.Minifig.drawPortrait(ctx, this.opts.portrait, this.cx, y + 30 * s, 40 * s); UI.goldRing(ctx, this.cx, y + 30 * s, 40 * s, 5 * s); y += 80 * s; }
      for (const l of this.lines) { UI.text(ctx, l, this.cx, y, { size: 17 * s, color: '#fff' }); y += 26 * s; }
      this.ui.render(ctx); ctx.restore();
    }
  }

  return { Base, Pause, Settings, Confirm, Message };
})();

<script>
/* ============================================================
   Boot + Main Menu scenes
   ============================================================ */
NT.Scenes = NT.Scenes || {};
const __UI = NT.UI;

// draws the game logo
NT.UI.logo = function (ctx, x, y, w, t = 0) {
  const s = w / 420; ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // LEGO tile
  ctx.save(); ctx.translate(-228, -34); ctx.fillStyle = '#d0202a'; NT.Minifig.rr(ctx, -30, -30, 60, 60, 8); ctx.fill(); ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 4; NT.Minifig.rr(ctx, -27, -27, 54, 54, 6); ctx.stroke(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; NT.Minifig.rr(ctx, -30, -30, 60, 60, 8); ctx.stroke();
  NT.UI.text(ctx, 'LEGO', 0, 1, { size: 22, color: '#fff', stroke: '#111', strokeWidth: 4, weight: '900' }); ctx.restore();
  // NINJAGO
  ctx.save(); ctx.transform(1, 0, -0.08, 1, 0, 0);
  NT.UI.goldText(ctx, 'NINJAGO', 36, -30, 80, { weight: '900', strokeWidth: 12, stroke: '#2a0a3a', top: '#fff6c8', mid: '#f4c542', bot: '#b0701a' });
  ctx.restore();
  // TOURNAMENT scroll
  NT.UI.scroll(ctx, 20, 42, 330, 46, null);
  NT.UI.goldText(ctx, 'TOURNAMENT', 20, 43, 30, { weight: '900', top: '#ffffff', mid: '#f0d888', bot: '#c89a3a' });
  ctx.restore();
};

NT.Scenes.Boot = class Boot {
  enter() { this.t = 0; this.ready = false; this.pressed = false; NT.Audio.playMusic('menu'); }
  update(dt) { this.t += dt; if (this.t > 1.4) this.ready = true; }
  go() { if (!this.ready || this.pressed) return; this.pressed = true; NT.Audio.unlock(); NT.Audio.play('select'); NT.SceneManager.go(new NT.Scenes.Menu(), {}, 'iris', 0.5); }
  onPointerDown() { this.go(); }
  onKeyDown() { this.go(); }
  render(ctx) {
    const W = NT.Game.W, H = NT.Game.H;
    __UI.menuBackground(ctx, W, H, this.t);
    const lw = Math.min(W * 0.8, 520);
    __UI.logo(ctx, W / 2, H * 0.36, lw, this.t);
    const bw = Math.min(W * 0.6, 360), by = H * 0.62;
    if (!this.ready) { __UI.bar(ctx, W / 2 - bw / 2, by, bw, 26, Math.min(1, this.t / 1.3), { label: 'LOADING' }); }
    else { const a = 0.6 + 0.4 * Math.sin(this.t * 4); ctx.globalAlpha = a; __UI.goldText(ctx, NT.Input.touch || ('ontouchstart' in window) ? 'TAP TO START' : 'CLICK OR PRESS ANY KEY', W / 2, by + 13, Math.min(30, W * 0.05)); ctx.globalAlpha = 1; }
    __UI.text(ctx, 'Fan-made recreation · not affiliated with LEGO', W / 2, H - 18, { size: 11, color: 'rgba(255,240,200,0.55)', weight: 'normal' });
  }
};

NT.Scenes.Menu = class Menu {
  constructor() { this.ui = new __UI.UILayer(); this.t = 0; }
  enter() {
    this.t = 0; NT.Audio.playMusic('menu');
    this.figs = ['kai', 'jay', 'lloyd', 'cole', 'zane'].map((id) => NT.Characters.get(id));
    this.layout(NT.Game.W, NT.Game.H);
  }
  layout(W, H) {
    this.ui.clear(); const s = Math.min(W / 900, H / 560); const r = Math.max(34, 52 * Math.max(0.7, s));
    this.ui.add({ id: 'play', x: W - r - 22, y: H - r - 22, r, onTap: () => NT.SceneManager.go(new NT.Scenes.ArenaSelect(), {}, 'iris'), draw: (ctx, b) => __UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: __UI.Icons.play, glow: '#ffd86a', glowAmt: 0.6 + 0.4 * Math.sin(this.t * 4) }) });
    this.ui.add({ id: 'settings', x: r + 22, y: H - r - 22, r, onTap: () => NT.SceneManager.pushOverlay(new NT.Overlays.Settings()), draw: (ctx, b) => __UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: __UI.Icons.gear }) });
    this.ui.add({ id: 'chars', x: W / 2, y: H - 46, w: Math.min(260, W * 0.4), h: 44, shape: 'rect', onTap: () => NT.SceneManager.go(new NT.Scenes.CharSelect(), { from: 'menu' }, 'iris'), draw: (ctx, b) => __UI.pillButton(ctx, b.x, b.y, b.w, b.h, 'CHARACTERS', { press: b.press, size: 18 }) });
    this.s = s;
  }
  resize(w, h) { this.layout(w, h); }
  update(dt) { this.t += dt; this.ui.update(dt); }
  onPointerDown(p) { this.ui.onPointerDown(p); }
  onPointerMove(p) { this.ui.onPointerMove(p); }
  onPointerUp(p) { this.ui.onPointerUp(p); }
  onKeyDown(c) { if (c === 'Enter' || c === 'Space') this.ui.get('play').onTap(); }
  render(ctx) {
    const W = NT.Game.W, H = NT.Game.H, t = this.t;
    __UI.menuBackground(ctx, W, H, t);
    // floor line for figures
    const fy = H * 0.72; const g = ctx.createLinearGradient(0, fy - 80, 0, fy + 40); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = g; ctx.fillRect(0, fy - 80, W, 120);
    // animated ninja line-up
    const n = this.figs.length; const spacing = Math.min(150, W / (n + 1)); const sc = Math.min(1.5, Math.max(0.8, H / 600));
    this.figs.forEach((c, i) => {
      const x = W / 2 + (i - (n - 1) / 2) * spacing; const ph = t * 2 + i;
      const pose = i === 2 ? { armL: 2.9, armR: 2.9, bob: -Math.abs(Math.sin(t * 3)) * 10, weaponAngle: Math.PI } : { armL: 0.2 + Math.sin(ph) * 0.05, armR: 0.25, bob: Math.sin(ph) * 1.5, weaponAngle: Math.PI + 0.3 };
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x, fy, 30 * sc, 10 * sc, 0, 0, 6.283); ctx.fill();
      ctx.translate(x, fy); ctx.scale(sc, sc); NT.Minifig.draw(ctx, c.look, pose, { facing: Math.PI / 2 + Math.sin(t * 0.7 + i) * 0.5 }); ctx.restore();
    });
    const lw = Math.min(W * 0.78, 520);
    __UI.logo(ctx, W / 2, H * 0.24, lw, t);
    // progress line
    const d = NT.Save.get(); const a = NT.Arenas.get(d.currentArena) || NT.Arenas.list[0];
    const done = NT.Tournament.isTournamentComplete();
    __UI.goldText(ctx, done ? 'TOURNAMENT CHAMPION!' : `Next: ${a.name} · Round ${Math.min(NT.Tournament.ROUNDS, d.currentRound + 1)}`, W / 2, H * 0.44, Math.min(20, W * 0.035), { mid: '#fff0b0' });
    // studs
    ctx.save(); ctx.translate(W - 60, 34); ctx.scale(0.36, 0.36); __UI.Icons.stud(ctx); ctx.restore();
    __UI.goldText(ctx, NT.Util.fmtNum(d.studs), W - 84, 34, 22, { align: 'right' });
    this.ui.render(ctx);
  }
};

</script>
<script>
/* ============================================================
   Arena Select — scroll title, framed live arena preview, side
   previews, gift box (top-left), shop coin (top-right), round pips,
   back (bottom-left) and play (bottom-right).
   ============================================================ */
NT.Scenes.ArenaSelect = class ArenaSelect {
  constructor() { this.ui = new NT.UI.UILayer(); this.t = 0; }
  enter(params) {
    const d = NT.Save.get(); this.t = 0;
    this.index = Math.max(0, NT.Tournament.arenaIndex(params.arenaId || d.currentArena));
    this.round = params.round != null ? params.round : d.currentRound;
    this.slide = 0; this.slideFrom = this.index; this.previewCams = {};
    NT.Audio.playMusic('menu');
    this.clampRound();
    this.layout(NT.Game.W, NT.Game.H);
  }
  clampRound() { const a = NT.Arenas.list[this.index]; const cleared = NT.Save.arenaProgress(a.id).cleared; this.round = Math.min(this.round, Math.min(cleared, NT.Tournament.ROUNDS - 1)); if (this.round < 0) this.round = 0; }
  layout(W, H) {
    this.ui.clear(); const s = Math.min(W / 900, H / 560); const r = Math.max(30, 46 * Math.max(0.7, s)); this.s = s; this.r = r;
    const land = W >= H;
    this.frame = { w: Math.min(W * (land ? 0.44 : 0.8), 620), h: 0 }; this.frame.h = this.frame.w * 0.58; this.frame.x = W / 2 - this.frame.w / 2; this.frame.y = (land ? H * 0.19 : H * 0.2);
    this.ui.add({ id: 'gift', x: r + 20, y: r + 20, r, onTap: () => this.gift(), draw: (ctx, b) => { const ready = NT.Progression.giftReady(); NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.gift, glow: ready ? '#ffd86a' : null, glowAmt: 0.6 + 0.4 * Math.sin(this.t * 5) }); NT.UI.text(ctx, ready ? 'GIFT!' : NT.Progression.giftCountdown(), b.x, b.y + b.r + 12, { size: 11, color: '#ffe9a0', stroke: '#2a1408', strokeWidth: 3 }); } });
    this.ui.add({ id: 'shop', x: W - r - 20, y: r + 20, r, onTap: () => NT.SceneManager.go(new NT.Scenes.CharSelect(), { from: 'arena', shop: true, arenaId: NT.Arenas.list[this.index].id, round: this.round }, 'iris'), draw: (ctx, b) => NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.coin, iconScale: 1.1 }) });
    this.ui.add({ id: 'back', x: r + 20, y: H - r - 20, r, onTap: () => NT.SceneManager.go(new NT.Scenes.Menu(), {}, 'fade'), draw: (ctx, b) => NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.back }) });
    this.ui.add({ id: 'play', x: W - r - 20, y: H - r - 20, r, onTap: () => this.play(), draw: (ctx, b) => { const ok = NT.Tournament.isArenaUnlocked(NT.Arenas.list[this.index].id); NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.play, disabled: !ok, glow: ok ? '#ffd86a' : null, glowAmt: 0.5 + 0.5 * Math.sin(this.t * 4) }); } });
    // arrows
    const ay = this.frame.y + this.frame.h / 2; const ax = land ? this.frame.x - r * 1.6 : r + 10;
    this.ui.add({ id: 'left', x: land ? ax : r + 14, y: land ? ay : this.frame.y + this.frame.h + 40, r: r * 0.8, onTap: () => this.move(-1), draw: (ctx, b) => NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.arrowL, disabled: this.index === 0 }) });
    this.ui.add({ id: 'right', x: land ? W - ax : W - r - 14, y: land ? ay : this.frame.y + this.frame.h + 40, r: r * 0.8, onTap: () => this.move(1), draw: (ctx, b) => NT.UI.roundButton(ctx, b.x, b.y, b.r, { press: b.press, icon: NT.UI.Icons.arrowR, disabled: this.index === NT.Arenas.list.length - 1 }) });
    // round pips
    const pr = Math.max(14, 20 * Math.max(0.7, s)); const py = this.frame.y + this.frame.h + (land ? 46 : 90); this.pipY = py; this.pipR = pr;
    for (let i = 0; i < NT.Tournament.ROUNDS; i++) { const x = W / 2 + (i - 2) * pr * 2.6; this.ui.add({ id: 'pip' + i, x, y: py, r: pr, onTap: () => { const a = NT.Arenas.list[this.index]; const cleared = NT.Save.arenaProgress(a.id).cleared; if (i <= cleared && i < NT.Tournament.ROUNDS) { this.round = i; NT.Audio.play('select'); } else NT.Audio.play('error'); }, draw: (ctx, b) => { const a = NT.Arenas.list[this.index]; const cleared = NT.Save.arenaProgress(a.id).cleared; const lit = i < cleared; const sel = i === this.round; NT.UI.medallion(ctx, b.x, b.y, b.r * (sel ? 1.15 : 1), i + 1, lit || sel, { glow: sel }); if (sel) { ctx.save(); ctx.strokeStyle = '#fff0b0'; ctx.lineWidth = 3; ctx.shadowColor = '#ffd86a'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.25, 0, 6.283); ctx.stroke(); ctx.restore(); } } }); }
    // touch swipe on the frame
    this.ui.add({ id: 'frame', x: W / 2, y: this.frame.y + this.frame.h / 2, w: this.frame.w, h: this.frame.h, shape: 'rect', silent: true, onUp: (p, inside) => { const dx = p.x - p.sx; if (Math.abs(dx) > 60) this.move(dx < 0 ? 1 : -1); else if (inside && !p.moved) this.play(); } });
  }
  resize(w, h) { this.layout(w, h); }
  move(dir) { const ni = NT.Util.clamp(this.index + dir, 0, NT.Arenas.list.length - 1); if (ni === this.index) return; this.slideFrom = this.index; this.index = ni; this.slide = 1; this.round = Math.min(NT.Save.arenaProgress(NT.Arenas.list[ni].id).cleared, NT.Tournament.ROUNDS - 1); NT.Audio.play('whoosh'); }
  play() {
    const a = NT.Arenas.list[this.index];
    if (!NT.Tournament.isArenaUnlocked(a.id)) { NT.Audio.play('error'); NT.SceneManager.pushOverlay(new NT.Overlays.Message('LOCKED', [`Complete ${NT.Arenas.list[this.index - 1].name}`, 'to unlock this arena.'], { icon: NT.UI.Icons.lock })); return; }
    const d = NT.Save.get(); d.currentArena = a.id; d.currentRound = this.round; NT.Save.save();
    NT.Audio.play('select');
    NT.SceneManager.go(new NT.Scenes.CharSelect(), { from: 'arena', arenaId: a.id, round: this.round }, 'iris');
  }
  gift() {
    if (!NT.Progression.giftReady()) { NT.Audio.play('error'); NT.SceneManager.pushOverlay(new NT.Overlays.Message('DAILY GIFT', ['Your next gift is ready in', NT.Progression.giftCountdown() + '.'], { icon: NT.UI.Icons.gift })); return; }
    const g = NT.Progression.claimGift(); NT.Audio.play('gift');
    NT.SceneManager.pushOverlay(new NT.Overlays.Message('DAILY GIFT', [`You received ${NT.Util.fmtNum(g.studs)} studs!`, `Gift streak: ${g.streak}`], { icon: NT.UI.Icons.gift }));
  }
  update(dt) { this.t += dt; this.ui.update(dt); this.slide = Math.max(0, this.slide - dt * 3.2); if (NT.Input.consumePressed('ArrowLeft')) this.move(-1); if (NT.Input.consumePressed('ArrowRight')) this.move(1); if (NT.Input.consumePressed('Enter') || NT.Input.consumePressed('Space')) this.play(); if (NT.Input.consumePressed('Escape')) this.ui.get('back').onTap(); }
  onPointerDown(p) { this.ui.onPointerDown(p); }
  onPointerMove(p) { this.ui.onPointerMove(p); }

<script>
/* ============================================================

NT.Scenes.TruePotential = class TruePotential {
  constructor() { this.ui = new NT.UI.UILayer(); this.t = 0; }
  enter(params) {

    this.litFx = []; NT.Audio.playMusic('menu');
    this.layout(NT.Game.W, NT.Game.H);

    UI.goldText(ctx, this.char.name, W / 2, py + pr * 1.55, Math.max(18, 0.045 * base), { mid: '#fff0b0' });
    UI.goldText(ctx, rank, W / 2, py + pr * 2.15, Math.max(16, 0.038 * base));
    UI.text(ctx, desc, W / 2, py + pr * 2.55, { size: Math.max(12, 0.024 * base), color: '#fff', stroke: '#2a1408', strokeWidth: 3 });
    // medallions
    const mr = Math.max(18, 0.055 * base); const my = land ? 0.74 * H : 0.62 * H; const sp = mr * 3.1;
    for (let i = 0; i < 5; i++) { const x = W / 2 + (i - 2) * sp; const lit = i < this.animLevel; const fx = this.litFx.find((f) => f.i === i); const sc = fx ? 1 + Math.sin(Math.min(1, fx.t) * Math.PI) * 0.3 : 1; UI.medallion(ctx, x, my, mr * sc, i + 1, lit); if (fx && fx.t < 0.8) { ctx.save(); ctx.globalAlpha = 1 - fx.t / 0.8; ctx.strokeStyle = '#fff0b0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, my, mr + fx.t * 120, 0, U.TAU); ctx.stroke(); ctx.restore(); } }
    // level bar
    const bw = Math.min(W * 0.36, 330), bh = Math.max(26, 0.06 * base), bx = W / 2 - bw / 2 + 30, by = land ? 0.86 * H : 0.75 * H;
    const next = NT.Progression.xpToNext(this.animLevel);
    UI.goldText(ctx, `Level: ${this.animLevel}`, bx - 16, by + bh / 2, Math.max(14, 0.03 * base), { align: 'right' });
    UI.bar(ctx, bx, by, bw, bh, next ? this.animXp / next : 1, { label: next ? `${Math.floor(this.animXp)} / ${next}` : 'MAX LEVEL' });
    if (this.p.result) UI.goldText(ctx, `+${this.p.result.xp} XP`, W / 2, by + bh + 0.04 * base, Math.max(13, 0.028 * base), { mid: '#c8a8ff' });
    this.ui.render(ctx);
  }
};

</script>
<script>
/* ============================================================
   NT.Game — bootstrap, canvas sizing, main loop
   ============================================================ */
NT.Game = (function () {
  let canvas, ctx, W = 800, H = 600, dpr = 1, last = 0, running = false, time = 0, fpsAcc = 0, fpsN = 0, fps = 60;
  const listeners = [];

  function resize() {
    W = Math.max(320, window.innerWidth); H = Math.max(240, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, W * H > 1500 * 900 ? 1.25 : 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    NT.SceneManager.resize(W, H);
    const hint = document.getElementById('rotate-hint');
    if (hint) { if (H > W && W < 700 && NT.SceneManager.current instanceof NT.Scenes.Battle) hint.classList.add('show'); else hint.classList.remove('show'); }
  }
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    let dt = (ts - last) / 1000; last = ts;
    if (!(dt > 0)) dt = 0.016; if (dt > 0.05) dt = 0.05;
    time += dt;
    fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    try {
      NT.SceneManager.update(dt);
      ctx.save(); NT.SceneManager.render(ctx); ctx.restore();
    } catch (e) { console.error(e); ctx.fillStyle = '#300'; ctx.fillRect(0, 0, W, 40); ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillText('Error: ' + (e && e.message), 6, 24); }
    NT.Input.endFrame();
  }
  function start() {
    canvas = document.getElementById('game'); ctx = canvas.getContext('2d', { alpha: false });
    NT.Save.load();
    NT.Input.init(canvas);
    window.addEventListener('resize', () => { resize(); });
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));
    document.addEventListener('visibilitychange', () => { if (document.hidden) { const c = NT.SceneManager.current; if (c && c.onBlur) c.onBlur(); } });
    resize();
    NT.SceneManager.replaceImmediate(new NT.Scenes.Boot(), {});
    running = true; last = performance.now(); requestAnimationFrame(loop);
  }
  function onSettings(fn) { listeners.push(fn); }
  function notifySettings() { for (const fn of listeners) fn(); const c = NT.SceneManager.current; if (c && c.onSettingsChanged) c.onSettingsChanged(); }
  return { start, get W() { return W; }, get H() { return H; }, get ctx() { return ctx; }, get canvas() { return canvas; }, get time() { return time; }, get fps() { return fps; }, resize, onSettings, notifySettings };
})();
window.addEventListener('DOMContentLoaded', () => NT.Game.start());

</script>
